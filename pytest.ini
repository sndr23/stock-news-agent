# filepath: pytest.ini
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring network/external services
    unit: marks pure unit tests (no network, no LLM calls)
filterwarnings =
    ignore::DeprecationWarning
