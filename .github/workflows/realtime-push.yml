# filepath: .github/workflows/realtime-push.yml
name: 实时重大资讯推送

# 触发方式（仅外部定时服务 + 手动，不用 GitHub 自带 cron——自带 cron 有调度延迟）:
#   1. cron-job.org 每 30 分钟 POST 到 Actions API 触发 workflow_dispatch（延迟 <1 分钟，准时）
#      URL: https://api.github.com/repos/{owner}/{repo}/actions/workflows/realtime-push.yml/dispatches
#      Method: POST   Headers: Authorization: Bearer <PAT>、Accept: application/vnd.github+json
#      Body: {"ref": "main"}
#   2. 手动 workflow_dispatch 立即执行一轮（验证用）
#
# ⚠️ 免费额度提醒:
#   公开仓库: Actions 分钟数无限
#   私有仓库: 2000 分钟/月。每次运行约 1.5-2 分钟（含依赖安装+LLM判定），
#            每 30 分钟一次 ≈ 1440-1900 分钟/月，接近上限。
#            若为私有仓库且用量吃紧，可在 cron-job.org 改为每小时一次
#            （"0 * * * *"，约 720-960 分钟/月），或保持 30 分钟但观察 Actions 用量。
on:
  workflow_dispatch:

# 防并发: 同一时刻只允许一个运行，后触发的排队等待
# （cancel-in-progress: false 保证状态文件写回不会被打断，
#   避免"已推送但未写状态 → 下轮重复推送"）
concurrency:
  group: realtime-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # LLM 判定（复用现有 secrets）
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL_NAME: ${{ secrets.OPENROUTER_MODEL_NAME }}
      OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
      # 推送后端（推荐 PushPlus，无需企业微信）:
      # PUSHPLUS_TOKEN: pushplus.plus 扫码获取（免费200条/天，严格模式够用）
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      # WECOM_WEBHOOK: 企业微信群机器人（可选替代渠道）
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      # 状态持久化（跨轮次去重，必配！否则 CI 会报错退出）
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}
      # 阈值: 从 Secret 读取（与本地 .ENV 可各自配置）。未配置时脚本默认 strict:
      # 全市场级必推+板块级(强档或≥6)+龙头个股(强档或≥6)+外围科技必推,非龙头个股不推
      RT_PUSH_MODE: ${{ secrets.RT_PUSH_MODE }}
      # 1=全天7x24推送（含周末/隔夜海外消息）
      RT_ALWAYS_ON: "1"
      # 单轮进入 LLM 判定的候选条数上限
      RT_MAX_CANDIDATES: "40"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt

      # 轻量测试门禁（2026-08-06 新增）：单元测试均为 mock 型，本地实测 294 项约 6s。
      # 相比整个任务 1.5-2 分钟，测试耗时可忽略，但能拦截纯函数回归（依赖 ~= 升级/重构误伤）。
      #
      # ⚠️ 2026-08-31 事故修复：门禁失败不得阻断生产推送。
      # 8-29 起因 tests/test_strategy_data.py 的日期敏感性用例失败，连续 59 次运行
      # 卡死在本步、推送步骤被 skipped，导致 62 小时零推送；而这些用例与资讯推送
      # 链路无任何耦合。故改为 continue-on-error：门禁结果仅作告警，不阻断业务。
      - name: 运行单元测试门禁
        id: unit_gate
        continue-on-error: true
        run: python -m pytest tests/ -q -m "unit" --no-header -p no:cacheprovider

      - name: 门禁失败告警
        if: steps.unit_gate.outcome == 'failure'
        run: |
          echo "::warning::单元测试门禁失败，本轮推送仍继续执行，请尽快修复 tests/ 回归用例"

      # 实时轮询每次运行都跑全量测试会浪费大量免费分钟额度，故仅跑 unit 子集
      - name: 执行实时推送
        run: python scripts/real_time_push.py

      - name: 上传日志（调试用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtime-log-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
