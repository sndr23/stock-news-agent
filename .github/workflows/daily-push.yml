# filepath: .github/workflows/daily-push.yml
name: 每日资讯推送

on:
  # 纯云端方案：多重重试 cron + 去重检查
  # 每个时段3个cron(目标+15分钟重试+30分钟重试)，GitHub schedule延迟时重试自动补位
  # daily_push.py 的 _already_pushed_recently() 确保同一时段只推送一次
  schedule:
    # 09:00 BJT 早盘前 (3重保障)
    - cron: "0 1 * * *"      # UTC 01:00 = BJT 09:00
    - cron: "15 1 * * *"     # UTC 01:15 = BJT 09:15 重试
    - cron: "30 1 * * *"     # UTC 01:30 = BJT 09:30 重试
    # 12:00 BJT 午盘 (3重保障)
    - cron: "0 4 * * *"      # UTC 04:00 = BJT 12:00
    - cron: "15 4 * * *"     # UTC 04:15 = BJT 12:15 重试
    - cron: "30 4 * * *"     # UTC 04:30 = BJT 12:30 重试
    # 16:00 BJT 盘后 (3重保障)
    - cron: "0 8 * * *"      # UTC 08:00 = BJT 16:00
    - cron: "15 8 * * *"     # UTC 08:15 = BJT 16:15 重试
    - cron: "30 8 * * *"     # UTC 08:30 = BJT 16:30 重试
    # 22:00 BJT 晚间 (3重保障)
    - cron: "0 14 * * *"     # UTC 14:00 = BJT 22:00
    - cron: "15 14 * * *"    # UTC 14:15 = BJT 22:15 重试
    - cron: "30 14 * * *"    # UTC 14:30 = BJT 22:30 重试
  workflow_dispatch:
    # 手动触发（测试用）
    inputs:
      slot:
        description: '推送时段 (morning=09:00 / noon=12:00 / afternoon=16:00 / night=22:00)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - morning
          - noon
          - afternoon
          - night

# 防止两个时段的推送并发执行
concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL_NAME: ${{ secrets.OPENROUTER_MODEL_NAME }}
      # 推送后端三选一（优先级：WxPusher > PushPlus > 企业微信）
      WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
      WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      PUSH_TOP_N: "20"
      # 通过 inputs.slot 传递时段，daily_push.py 会读取 PUSH_SLOT 环境变量
      PUSH_SLOT: ${{ github.event.inputs.slot }}
      # GITHUB_TOKEN 用于 schedule 兜底去重检查（查最近 runs 避免重复推送）
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt
          pip install chinese_calendar

      - name: 运行单元测试
        run: python -m pytest tests/test_rank.py tests/test_schemas.py tests/test_prefilter.py tests/test_dedup.py tests/test_state.py tests/test_prefilter_flow.py -q

      - name: 执行推送
        run: python scripts/daily_push.py

      - name: 上传日志（调试用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-log-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
