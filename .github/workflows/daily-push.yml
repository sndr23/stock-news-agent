# filepath: .github/workflows/daily-push.yml
name: 每日资讯推送

on:
  # 主力：cron-job.org 通过 workflow_dispatch 触发（延迟<1分钟，4个时段已全部配置）
  # 兜底：GitHub Actions schedule 延后1小时，cron-job.org 失败时自动补位
  # daily_push.py 的 _already_pushed_recently() 确保不重复推送
  schedule:
    - cron: "0 2 * * *"     # UTC 02:00 = BJT 10:00 早盘兜底
    - cron: "0 5 * * *"     # UTC 05:00 = BJT 13:00 午盘兜底
    - cron: "0 9 * * *"     # UTC 09:00 = BJT 17:00 盘后兜底
    - cron: "0 15 * * *"    # UTC 15:00 = BJT 23:00 晚间兜底
  workflow_dispatch:
    # cron-job.org 定时调用 + 手动触发
    inputs:
      slot:
        description: '推送时段 (morning=09:00 / noon=12:00 / afternoon=16:00 / night=22:00)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - morning
          - noon
          - afternoon
          - night

# 防止两个时段的推送并发执行
concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL_NAME: ${{ secrets.OPENROUTER_MODEL_NAME }}
      # 推送后端三选一（优先级：WxPusher > PushPlus > 企业微信）
      WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
      WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      PUSH_TOP_N: "20"
      # 通过 inputs.slot 传递时段，daily_push.py 会读取 PUSH_SLOT 环境变量
      PUSH_SLOT: ${{ github.event.inputs.slot }}
      # GITHUB_TOKEN 用于 schedule 兜底去重检查（查最近 runs 避免重复推送）
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt
          pip install chinese_calendar

      - name: 运行单元测试
        run: python -m pytest tests/test_rank.py tests/test_schemas.py tests/test_prefilter.py tests/test_dedup.py tests/test_state.py tests/test_prefilter_flow.py -q

      - name: 执行推送
        run: python scripts/daily_push.py

      - name: 上传日志（调试用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-log-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
