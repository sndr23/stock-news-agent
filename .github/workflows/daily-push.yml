# filepath: .github/workflows/daily-push.yml
name: 每日资讯推送

on:
  schedule:
    # 4个推送时间点（北京时间，GitHub Actions cron 用 UTC，BJT = UTC + 8）
    # 注意: GitHub Actions cron 是"尽力而为"调度，高峰期(UTC 00:00附近)可能延迟数分钟到数小时
    - cron: "0 1 * * *"     # UTC 01:00 = BJT 09:00 早盘前
    - cron: "0 4 * * *"     # UTC 04:00 = BJT 12:00 午盘
    - cron: "0 8 * * *"     # UTC 08:00 = BJT 16:00 盘后
    - cron: "0 14 * * *"    # UTC 14:00 = BJT 22:00 晚间
  workflow_dispatch:        # 支持手动触发测试

# 防止 cron 延迟导致两个时段的推送并发执行
concurrency:
  group: daily-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL_NAME: ${{ secrets.OPENROUTER_MODEL_NAME }}
      # 推送后端三选一（优先级：WxPusher > PushPlus > 企业微信）
      WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
      WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      PUSH_TOP_N: "20"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt
          pip install chinese_calendar

      - name: 运行单元测试
        run: python -m pytest tests/test_rank.py tests/test_schemas.py tests/test_prefilter.py tests/test_dedup.py tests/test_state.py tests/test_prefilter_flow.py -q

      - name: 执行推送
        run: python scripts/daily_push.py

      - name: 上传日志（调试用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-log-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
