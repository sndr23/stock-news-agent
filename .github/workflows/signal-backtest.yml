# filepath: .github/workflows/signal-backtest.yml
name: 信号质量回测（手动）

# P2-3（2026-08-19）：信号有效性回测 + 质量报告。
#   已推事件（pushed_events，含 LLM 方向标注）vs 后 1/3/5/10 日实际行情 → 方向一致率。
#   用途：验证"利好买、利空卖"推送口径的实际有效性，一致率持续 <50% 时收紧阈值。
#
# 2026-09-19 用户决定停发周推：事件方向标签非可执行信号，一致率无证实价值；仅手动出报告，数据实际覆盖 backtest_events 上线（2026-09-08）之后。
#   保留 workflow_dispatch 手动触发能力，不再自动调度。
on:
  workflow_dispatch:
    inputs:
      days:
        description: "回测窗口天数"
        required: false
        default: "60"
        type: string

concurrency:
  group: signal-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # 回测需读 Gist 中的 pushed_events（云端容器无本地状态）
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt

      # 2026-08-31 事故修复:门禁失败不得阻断生产任务(详见 realtime-push.yml 注释)
      - name: 运行单元测试门禁
        id: unit_gate
        continue-on-error: true
        run: python -m pytest tests/ -q -m "unit" --no-header -p no:cacheprovider

      - name: 门禁失败告警
        if: steps.unit_gate.outcome == 'failure'
        run: |
          echo "::warning::单元测试门禁失败,本轮任务仍继续执行,请尽快修复 tests/ 回归用例"

      - name: 执行回测（仅出报告，不推送）
        run: python scripts/signal_backtest.py --days ${{ github.event.inputs.days || '60' }}

      - name: 上传报告与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-backtest-${{ github.run_id }}
          path: |
            logs/signal_quality_report.md
            logs/
          retention-days: 30
          if-no-files-found: ignore
