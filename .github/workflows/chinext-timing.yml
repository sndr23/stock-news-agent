# filepath: .github/workflows/chinext-timing.yml
name: 创业板仓位信号

# 每日 14:45（北京时间）推送创业板方向（CPO/PCB 场外基金）目标仓位建议，
# 用户在 15:00 截单前手动执行。数据链：399006 日线(新浪全量) + 盘中实时(腾讯)
# + factor_state 快照（贴水/资金/情绪/宽度/波动分位/risk_state）+ 缠论结构
# + 消息推送（PushPlus / 企业微信）。状态写入 Gist 跨容器持久化 + 本地降级。
#
# ⚠ 调度（2026-08-22 修正）：仅由 cron-job.org 准点主触发，不添加提前的 GitHub schedule。
#   GitHub 自带 cron 有 5-20 分钟调度延迟，不能保证 14:45+依赖安装后仍赶上 15:00 截单；
#   提前 schedule 会先写入 last_date，抢跑并抑制正常的 14:45 主触发。
#   配置（与 realtime-push.yml 同机制）：
#   cron-job.org 每日一次，cron="45 14 * * 1-5"（北京时间 14:45 触发，调度延迟<1 分钟；脚本运行约 1-2 分钟，推送约 14:47 送达，15:00 截单前余量充足）。
#   URL:  https://api.github.com/repos/{owner}/{repo}/actions/workflows/chinext-timing.yml/dispatches
#   Method: POST   Headers: Authorization: Bearer <PAT>、Accept: application/vnd.github+json
#   Body: {"ref": "main"}
#   首次手动验证：Actions → 创业板仓位信号 → Run workflow → Run
#   重复 run 由 concurrency + 脚本 last_date 去重兜底；外部调度失联需人工恢复或手动触发。
on:
  workflow_dispatch:
    inputs:
      force:
        description: "强制推送（--force，忽略同日去重，用于手动复验如周六再推一次）"
        required: false
        default: false
        type: boolean

concurrency:
  group: chinext-timing
  cancel-in-progress: false

jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt

      - name: 运行单元测试门禁
        run: python -m pytest tests/test_chinext_timing.py tests/test_chinext_factors.py tests/test_chan_light.py -q --no-header -p no:cacheprovider

      - name: 恢复数据缓存（新浪全量日线）
        uses: actions/cache@v4
        with:
          path: data/strategy_cache
          key: chinext-cache-${{ github.run_id }}
          restore-keys: |
            chinext-cache-

      - name: 执行仓位信号推送
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scripts/run_chinext_timing.py --push --shadow --force
          else
            python scripts/run_chinext_timing.py --push --shadow
          fi

      - name: 上传日志（调试用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chinext-timing-log-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
