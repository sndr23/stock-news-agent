# filepath: .github/workflows/market-brief.yml
name: 盘前简报与盘后复盘

# P0-2/P0-3（2026-08-19）：资讯与量化因子融合展示的两个定时入口。
#   morning: 北京时间 08:45（UTC 00:45）盘前简报——隔夜要闻 Top5 + 因子环境 + 自选关注
#   evening: 北京时间 15:10（UTC 07:10）盘后复盘——当日已推事件 + 方向/板块统计 + 收盘因子
#
# 注: 与 realtime-push.yml 不同，简报对分钟级延迟不敏感（非事件驱动），
# 直接用 GitHub 自带 cron（自带 cron 有 5-20 分钟调度延迟，简报可接受）。
# 周一至周五触发；周末/节假日由脚本内 RT_ALWAYS_ON + _is_trading_day 兜底跳过。
on:
  schedule:
    - cron: "45 0 * * 1-5"   # 北京时间 08:45 盘前简报
    - cron: "10 7 * * 1-5"   # 北京时间 15:10 盘后复盘
  workflow_dispatch:
    inputs:
      brief:
        description: "简报类型"
        required: true
        default: "morning"
        type: choice
        options: [morning, evening]

concurrency:
  group: market-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      # 简报不调用 LLM，仅需推送与 Gist 读取（因子快照来自 factor_collector 写入的状态）
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}
      RT_ALWAYS_ON: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-cloud.txt

      # 2026-08-31 事故修复:门禁失败不得阻断生产任务(详见 realtime-push.yml 注释)
      - name: 运行单元测试门禁
        id: unit_gate
        continue-on-error: true
        run: python -m pytest tests/ -q -m "unit" --no-header -p no:cacheprovider

      - name: 门禁失败告警
        if: steps.unit_gate.outcome == 'failure'
        run: |
          echo "::warning::单元测试门禁失败,本轮任务仍继续执行,请尽快修复 tests/ 回归用例"

      # schedule 触发时按 cron 时间区分早晚（两个 cron 语义不同）；手动触发读 input
      - name: 判断简报类型
        id: kind
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "brief=${{ inputs.brief }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%H%M)" -lt "0200" ]; then
            echo "brief=morning" >> "$GITHUB_OUTPUT"
          else
            echo "brief=evening" >> "$GITHUB_OUTPUT"
          fi

      - name: 执行简报
        run: python scripts/real_time_push.py --brief ${{ steps.kind.outputs.brief }}

      - name: 上传日志（调试用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-brief-log-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore
