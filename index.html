<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股资讯监测 Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            font-family: 'Inter', 'PingFang SC', -apple-system, sans-serif;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .spin {
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .scrollbar-thin::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .scrollbar-thin::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .scrollbar-thin::-webkit-scrollbar-track {
            background: transparent;
        }

        .score-bar {
            height: 5px;
            border-radius: 3px;
            background: #e5e7eb;
            overflow: hidden;
            position: relative;
        }

        .score-bar>span {
            display: block;
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .mini-bar {
            height: 4px;
            border-radius: 2px;
            background: #e5e7eb;
            overflow: hidden;
        }

        .mini-bar>span {
            display: block;
            height: 100%;
            border-radius: 2px;
        }

        .modal-backdrop {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- 顶部标题栏 -->
    <header class="bg-gradient-to-r from-blue-600 to-blue-700 shadow-md">
        <div class="max-w-[1600px] mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center">
                <div class="w-10 h-10 rounded-lg bg-white/20 flex items-center justify-center mr-3">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white">A股资讯监测 Agent</h1>
                    <p class="text-blue-200 text-xs mt-0.5">资讯获取 → 噪音清除 → 影响评分排名</p>
                </div>
            </div>
            <div class="flex items-center bg-white/10 rounded-full px-3 py-1.5">
                <span id="healthDot" class="w-2.5 h-2.5 rounded-full bg-gray-300 mr-2"></span>
                <span id="healthText" class="text-white text-sm">检测中…</span>
            </div>
        </div>
    </header>

    <div class="max-w-[1600px] mx-auto flex gap-6 p-6">

        <!-- 左侧控制面板 -->
        <aside class="w-72 flex-shrink-0">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 sticky top-6">
                <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-4 flex items-center">
                    <svg class="w-4 h-4 mr-1.5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    控制面板
                </h2>

                <!-- 执行按钮 -->
                <button id="runBtn"
                    class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold py-2.5 rounded-lg transition-all shadow-sm flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg id="runIcon" class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span id="runBtnText">获取当日资讯并排名</span>
                </button>

                <!-- 预览推送按钮 -->
                <button id="previewBtn"
                    class="w-full mt-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 rounded-lg transition-all text-sm flex items-center justify-center disabled:opacity-50 disabled:cursor-not-allowed"
                    disabled>
                    <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
                    </svg>
                    预览推送格式
                </button>

                <!-- 统计概览 -->
                <div id="statsBox" class="mt-5 hidden">
                    <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">处理概览</h3>
                    <div class="space-y-2">
                        <div class="flex items-center justify-between bg-blue-50 rounded-lg px-3 py-2">
                            <span class="text-xs text-gray-600">原始资讯</span>
                            <span id="statRaw" class="text-sm font-bold text-blue-700">0</span>
                        </div>
                        <div class="flex items-center justify-between bg-amber-50 rounded-lg px-3 py-2">
                            <span class="text-xs text-gray-600">过滤噪音后</span>
                            <span id="statFiltered" class="text-sm font-bold text-amber-700">0</span>
                        </div>
                        <div class="flex items-center justify-between bg-green-50 rounded-lg px-3 py-2">
                            <span class="text-xs text-gray-600">最终排名</span>
                            <span id="statRanked" class="text-sm font-bold text-green-700">0</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主区域 -->
        <main class="flex-1 min-w-0 space-y-6">

            <!-- 推理过程 -->
            <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <div class="flex items-center justify-between mb-5">
                    <h2 class="text-base font-semibold text-gray-800 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M13 10V3L4 14h7v7l9-11h-7z" />
                        </svg>
                        Agent 推理过程
                    </h2>
                    <span class="text-xs text-gray-400">fetch_news → filter_noise → rank_news</span>
                </div>
                <div id="stepsContainer" class="space-y-3"></div>
            </section>

            <!-- 结果表格 -->
            <section id="resultSection" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 hidden">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-base font-semibold text-gray-800 flex items-center">
                        <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        资讯排名结果
                    </h2>
                    <span id="resultCount" class="text-xs text-gray-400"></span>
                </div>
                <div class="overflow-x-auto scrollbar-thin">
                    <table class="w-full text-sm">
                        <thead>
                            <tr class="text-left text-xs text-gray-500 uppercase tracking-wide border-b border-gray-200">
                                <th class="py-3 px-2 w-12 text-center">排名</th>
                                <th class="py-3 px-2">标题</th>
                                <th class="py-3 px-2 w-28">来源</th>
                                <th class="py-3 px-2 w-32">时间</th>
                                <th class="py-3 px-2 w-20 text-center">Band</th>
                                <th class="py-3 px-2 w-20 text-center">方向</th>
                                <th class="py-3 px-2 w-32">影响板块</th>
                                <th class="py-3 px-2 w-40">综合分</th>
                            </tr>
                        </thead>
                        <tbody id="resultTable"></tbody>
                    </table>
                </div>
                <p class="text-xs text-gray-400 mt-3">点击标题可查看完整资讯详情与影响分析</p>
            </section>

            <!-- 空状态 -->
            <section id="emptyState" class="bg-white rounded-xl shadow-sm border border-gray-200 p-12 text-center">
                <svg class="w-16 h-16 mx-auto text-gray-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <p class="text-gray-500 text-sm">点击「获取当日资讯并排名」开始</p>
            </section>

        </main>
    </div>

    <!-- 详情弹窗 -->
    <div id="detailModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[88vh] flex flex-col">
            <!-- 弹窗头部 -->
            <div class="flex items-start justify-between p-5 border-b border-gray-100">
                <div class="flex-1 min-w-0 pr-4">
                    <h3 id="modalTitle" class="text-lg font-bold text-gray-800 leading-snug"></h3>
                    <div class="flex flex-wrap items-center gap-2 mt-2">
                        <span id="modalSource"></span>
                        <span id="modalBand"></span>
                        <span id="modalDirection"></span>
                        <span id="modalTime" class="text-xs text-gray-400"></span>
                    </div>
                </div>
                <button id="modalClose"
                    class="flex-shrink-0 w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <!-- 弹窗内容 -->
            <div class="p-5 overflow-y-auto scrollbar-thin flex-1 space-y-4">
                <!-- 完整内容 -->
                <div>
                    <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">资讯内容</h4>
                    <p id="modalContent" class="text-sm text-gray-700 leading-relaxed bg-gray-50 rounded-lg p-3 whitespace-pre-wrap"></p>
                </div>

                <!-- 影响分析 -->
                <div>
                    <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">影响分析</h4>
                    <div class="space-y-2">
                        <div class="flex items-start gap-2">
                            <span class="text-xs text-gray-500 w-20 flex-shrink-0 mt-0.5">影响板块</span>
                            <div id="modalSectors" class="flex flex-wrap gap-1.5"></div>
                        </div>
                        <div class="flex items-start gap-2">
                            <span class="text-xs text-gray-500 w-20 flex-shrink-0 mt-0.5">影响个股</span>
                            <div id="modalStocks" class="flex flex-wrap gap-1.5"></div>
                        </div>
                        <div class="flex items-start gap-2">
                            <span class="text-xs text-gray-500 w-20 flex-shrink-0 mt-0.5">影响逻辑</span>
                            <p id="modalReason" class="text-sm text-gray-700 leading-relaxed flex-1"></p>
                        </div>
                    </div>
                </div>

                <!-- 评分维度 -->
                <div>
                    <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">评分维度</h4>
                    <div class="grid grid-cols-3 gap-3">
                        <div id="scoreCred" class="bg-blue-50 rounded-lg p-3"></div>
                        <div id="scoreImp" class="bg-amber-50 rounded-lg p-3"></div>
                        <div id="scoreTime" class="bg-purple-50 rounded-lg p-3"></div>
                    </div>
                    <div class="mt-3 bg-gradient-to-r from-blue-600 to-blue-700 rounded-lg p-3 flex items-center justify-between">
                        <span class="text-white text-sm font-medium">综合分</span>
                        <span id="modalTotal" class="text-white text-xl font-bold"></span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 推送预览弹窗 -->
    <div id="pushPreviewModal" class="fixed inset-0 z-50 hidden items-center justify-center modal-backdrop p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[88vh] flex flex-col">
            <div class="flex items-start justify-between p-5 border-b border-gray-100">
                <div class="flex-1">
                    <h3 class="text-lg font-bold text-gray-800">推送格式预览</h3>
                    <p class="text-xs text-gray-400 mt-1">以下为微信推送的实际 Markdown 内容</p>
                </div>
                <button id="pushPreviewClose"
                    class="flex-shrink-0 w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-400 hover:text-gray-600 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div class="p-5 overflow-y-auto scrollbar-thin flex-1">
                <pre id="pushPreviewContent" class="text-sm text-gray-700 leading-relaxed bg-gray-50 rounded-lg p-4 whitespace-pre-wrap font-mono"></pre>
            </div>
        </div>
    </div>

    <script>
        // ===== 配置 =====
        const API_BASE = ''; // 同源访问

        // 影响方向样式：利好绿、利空红、中性灰
        const DIRECTION_META = {
            bullish: { label: '利好', cls: 'bg-red-100 text-red-700 border border-red-200' },
            bearish: { label: '利空', cls: 'bg-green-100 text-green-700 border border-green-200' },
            neutral: { label: '中性', cls: 'bg-gray-100 text-gray-600 border border-gray-200' }
        };

        // 6-band 样式（A股红涨绿跌）
        const BAND_META = {
            bullish:         { label: '强多',     cls: 'bg-red-500 text-white' },
            mildly_bullish:  { label: '偏多',     cls: 'bg-red-100 text-red-700' },
            neutral:         { label: '中性',     cls: 'bg-gray-100 text-gray-600' },
            mixed:           { label: '多空交织', cls: 'bg-yellow-100 text-yellow-700' },
            mildly_bearish:  { label: '偏空',     cls: 'bg-green-100 text-green-700' },
            bearish:         { label: '强空',     cls: 'bg-green-500 text-white' },
        };

        // 来源徽章配色：财联社=橙、东财=蓝、同花顺=青、新浪=红、交易所公告=紫、交易所信号=绿、其他=灰
        function sourceBadge(source) {
            const s = String(source || '');
            if (s.includes('财联社')) {
                return { label: s, cls: 'bg-orange-100 text-orange-700 border border-orange-200' };
            }
            if (s.includes('东方财富')) {
                return { label: s, cls: 'bg-blue-100 text-blue-700 border border-blue-200' };
            }
            if (s.includes('同花顺')) {
                return { label: s, cls: 'bg-cyan-100 text-cyan-700 border border-cyan-200' };
            }
            if (s.includes('新浪')) {
                return { label: s, cls: 'bg-red-100 text-red-700 border border-red-200' };
            }
            if (s.includes('龙虎榜') || s.includes('业绩预告')) {
                return { label: s, cls: 'bg-green-100 text-green-700 border border-green-200' };
            }
            if (s.includes('交易所') || s.includes('公告')) {
                return { label: s, cls: 'bg-purple-100 text-purple-700 border border-purple-200' };
            }
            return { label: s || '—', cls: 'bg-gray-100 text-gray-600 border border-gray-200' };
        }

        // 四步推理节点定义
        const STEPS = [
            {
                id: 'fetch_news',
                name: 'fetch_news',
                title: '抓取当日全部资讯',
                desc: '多源并行获取当日A股财经新闻与交易所公告，按日期过滤+去重'
            },
            {
                id: 'prefilter',
                name: 'prefilter',
                title: 'Python预过滤',
                desc: '关键词去噪 + 去重 + 重要度初筛'
            },
            {
                id: 'llm_filter',
                name: 'llm_filter',
                title: 'LLM标签分析',
                desc: '条目级智能分流：仅对含重磅信号的快讯进行深度标签化与情感分析，无信号则跳过'
            },
            {
                id: 'rank_news',
                name: 'rank_news',
                title: '全局评分排名',
                desc: '采用 Sigmoid 压缩拉开顶部差距，融入时间新鲜度衰减和情感倾向溢价'
            }
        ];

        // ===== 状态 =====
        let isRunning = false;
        let currentRanked = [];

        // ===== 工具函数 =====
        async function api(path, options) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 300000); // 300秒超时 (LLM分析全量资讯耗时较长)
            try {
                const res = await fetch(API_BASE + path, { ...options, signal: controller.signal });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({ detail: res.statusText }));
                    throw new Error(err.detail || `HTTP ${res.status}`);
                }
                return res.json();
            } catch (e) {
                if (e.name === 'AbortError') {
                    throw new Error('请求超时（300秒），请检查网络或稍后重试');
                }
                throw e;
            } finally {
                clearTimeout(timeoutId);
            }
        }

        function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // ===== 健康检查 =====
        async function checkHealth() {
            const dot = document.getElementById('healthDot');
            const text = document.getElementById('healthText');
            try {
                await api('/api/health');
                dot.className = 'w-2.5 h-2.5 rounded-full bg-green-400 mr-2';
                text.textContent = '后端已连接';
            } catch (e) {
                dot.className = 'w-2.5 h-2.5 rounded-full bg-red-400 mr-2';
                text.textContent = '后端未连接';
            }
        }

        // ===== 渲染步骤 =====
        function renderSteps() {
            const container = document.getElementById('stepsContainer');
            container.innerHTML = STEPS.map((s, i) => `
                <div id="step-${s.id}" class="flex items-start border rounded-lg p-4 transition-all border-gray-200 bg-gray-50">
                    <div id="step-icon-${s.id}" class="flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold bg-gray-200 text-gray-500 mr-3">
                        ${i + 1}
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between">
                            <div>
                                <span class="font-mono text-sm font-semibold text-gray-700">${s.name}</span>
                                <span class="text-gray-400 mx-2">·</span>
                                <span class="text-sm text-gray-600">${s.title}</span>
                            </div>
                            <span id="step-status-${s.id}" class="text-xs px-2 py-0.5 rounded-full bg-gray-200 text-gray-500">等待</span>
                        </div>
                        <p class="text-xs text-gray-400 mt-1">${s.desc}</p>
                        <div id="step-detail-${s.id}" class="hidden mt-2 text-xs font-mono text-gray-500 bg-white border border-gray-100 rounded px-2 py-1.5 break-all"></div>
                    </div>
                </div>
            `).join('');
        }

        function setStepStatus(idx, status, detail) {
            const step = STEPS[idx];
            const wrap = document.getElementById(`step-${step.id}`);
            const icon = document.getElementById(`step-icon-${step.id}`);
            const badge = document.getElementById(`step-status-${step.id}`);
            const detailEl = document.getElementById(`step-detail-${step.id}`);

            const config = {
                waiting: { wrap: 'border-gray-200 bg-gray-50', icon: 'bg-gray-200 text-gray-500', badge: 'bg-gray-200 text-gray-500', text: '等待', iconHtml: String(idx + 1) },
                running: { wrap: 'border-blue-300 bg-blue-50', icon: 'bg-blue-100 text-blue-600', badge: 'bg-blue-100 text-blue-700', text: '执行中', iconHtml: '<svg class="spin w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>' },
                done: { wrap: 'border-green-200 bg-green-50', icon: 'bg-green-500 text-white', badge: 'bg-green-100 text-green-700', text: '完成', iconHtml: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>' },
                error: { wrap: 'border-red-200 bg-red-50', icon: 'bg-red-500 text-white', badge: 'bg-red-100 text-red-700', text: '失败', iconHtml: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" /></svg>' }
            }[status];

            wrap.className = `flex items-start border rounded-lg p-4 transition-all ${config.wrap}`;
            icon.className = `flex-shrink-0 w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold mr-3 ${config.icon}`;
            icon.innerHTML = config.iconHtml;
            badge.className = `text-xs px-2 py-0.5 rounded-full ${config.badge}`;
            badge.textContent = config.text;

            if (detail) {
                detailEl.textContent = detail;
                detailEl.classList.remove('hidden');
            }
        }

        function resetSteps() {
            STEPS.forEach((_, i) => setStepStatus(i, 'waiting'));
            STEPS.forEach(s => {
                document.getElementById(`step-detail-${s.id}`).classList.add('hidden');
            });
        }

        // ===== 渲染结果表格 =====
        function renderTable(rankedNews) {
            const tbody = document.getElementById('resultTable');
            const section = document.getElementById('resultSection');
            const empty = document.getElementById('emptyState');
            const countEl = document.getElementById('resultCount');

            if (!rankedNews || rankedNews.length === 0) {
                section.classList.add('hidden');
                empty.classList.remove('hidden');
                empty.querySelector('p').textContent = '没有符合条件的资讯';
                return;
            }

            // 前端保险：按综合分降序
            const sorted = [...rankedNews].sort((a, b) => (b.total_score || 0) - (a.total_score || 0));
            currentRanked = sorted;

            empty.classList.add('hidden');
            section.classList.remove('hidden');
            countEl.textContent = `共 ${sorted.length} 条 · 按综合分降序`;

            const rankColors = [
                'bg-yellow-100 text-yellow-700 font-bold',
                'bg-gray-200 text-gray-700 font-bold',
                'bg-orange-100 text-orange-700 font-bold'
            ];

            tbody.innerHTML = sorted.map((n, i) => {
                const cred = (n.credibility_score ?? 0);
                const imp = ((n.market_impact_score ?? 0) / 10);
                const tf = (n.time_factor ?? 0);
                const total = (n.total_score ?? 0);
                const dir = DIRECTION_META[n.impact_direction] || DIRECTION_META.neutral;
                const band = BAND_META[n.impact_band] || BAND_META.neutral;
                const rankCls = i < 3 ? rankColors[i] : 'text-gray-500';
                const title = n.title || '（无标题）';
                const src = sourceBadge(n.source);
                const sectors = Array.isArray(n.affected_sectors) ? n.affected_sectors : [];
                const time = n.published_at || '—';

                return `
                <tr class="border-b border-gray-100 hover:bg-blue-50/40 transition-colors fade-in" style="animation-delay:${i * 30}ms">
                    <td class="py-3 px-2 text-center align-top">
                        <span class="inline-flex items-center justify-center w-7 h-7 rounded-full text-xs ${rankCls}">${i + 1}</span>
                    </td>
                    <td class="py-3 px-2 align-top">
                        <button data-idx="${i}" class="title-btn text-left text-gray-800 leading-snug hover:text-blue-600 hover:underline transition-colors">
                            <span class="line-clamp-2">${escapeHtml(title)}</span>
                        </button>
                    </td>
                    <td class="py-3 px-2 align-top">
                        <span class="inline-block text-xs px-2 py-0.5 rounded-full line-clamp-1 ${src.cls}" title="${escapeHtml(src.label)}">${escapeHtml(src.label)}</span>
                    </td>
                    <td class="py-3 px-2 align-top text-gray-500 text-xs whitespace-nowrap">${escapeHtml(time)}</td>
                    <td class="py-3 px-2 align-top text-center">
                        <span class="inline-block text-xs px-2 py-0.5 rounded-full font-medium ${band.cls}">${band.label}</span>
                    </td>
                    <td class="py-3 px-2 align-top text-center">
                        <span class="inline-block text-xs px-2 py-0.5 rounded-full ${dir.cls}">${dir.label}</span>
                    </td>
                    <td class="py-3 px-2 align-top">
                        ${sectors.length
                        ? sectors.map(sec => `<span class="inline-block text-xs px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-600 mr-1 mb-1">${escapeHtml(sec)}</span>`).join('')
                        : '<span class="text-xs text-gray-300">—</span>'}
                    </td>
                    <td class="py-3 px-2 align-top">
                        <div class="flex items-center mb-1.5">
                            <span class="text-base font-bold text-blue-700">${total.toFixed(4)}</span>
                        </div>
                        <div class="score-bar mb-1"><span style="width:${(total * 100).toFixed(0)}%;background:linear-gradient(90deg,#3b82f6,#1d4ed8)"></span></div>
                        <div class="flex items-center gap-2 text-[10px] text-gray-500">
                            <span title="可信度">可${cred.toFixed(2)}</span>
                            <span title="重要度">重${imp.toFixed(2)}</span>
                            <span title="时间因子">时${tf.toFixed(2)}</span>
                        </div>
                    </td>
                </tr>`;
            }).join('');

            // 绑定标题点击事件
            tbody.querySelectorAll('.title-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.idx, 10);
                    openModal(currentRanked[idx]);
                });
            });
        }

        // ===== 详情弹窗 =====
        function openModal(n) {
            if (!n) return;
            const modal = document.getElementById('detailModal');

            // 标题
            document.getElementById('modalTitle').textContent = n.title || '（无标题）';

            // 来源徽章
            const src = sourceBadge(n.source);
            const srcEl = document.getElementById('modalSource');
            srcEl.className = `inline-block text-xs px-2 py-0.5 rounded-full ${src.cls}`;
            srcEl.textContent = src.label;

            // 影响方向
            const dir = DIRECTION_META[n.impact_direction] || DIRECTION_META.neutral;
            const dirEl = document.getElementById('modalDirection');
            dirEl.className = `inline-block text-xs px-2 py-0.5 rounded-full ${dir.cls}`;
            dirEl.textContent = dir.label;

            // Band
            const band = BAND_META[n.impact_band] || BAND_META.neutral;
            const bandEl = document.getElementById('modalBand');
            bandEl.className = `inline-block text-xs px-2 py-0.5 rounded-full font-medium ${band.cls}`;
            bandEl.textContent = `Band: ${band.label}`;

            // 时间
            document.getElementById('modalTime').textContent = n.published_at || '';

            // 完整内容
            document.getElementById('modalContent').textContent = n.content || '（无内容）';

            // 影响板块
            const sectorsEl = document.getElementById('modalSectors');
            const sectors = Array.isArray(n.affected_sectors) ? n.affected_sectors : [];
            sectorsEl.innerHTML = sectors.length
                ? sectors.map(s => `<span class="inline-block text-xs px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-700">${escapeHtml(s)}</span>`).join('')
                : '<span class="text-xs text-gray-400">无</span>';

            // 影响个股
            const stocksEl = document.getElementById('modalStocks');
            const stocks = Array.isArray(n.affected_stocks) ? n.affected_stocks : [];
            stocksEl.innerHTML = stocks.length
                ? stocks.map(s => `<span class="inline-block text-xs px-2 py-0.5 rounded-md bg-rose-100 text-rose-700">${escapeHtml(s)}</span>`).join('')
                : '<span class="text-xs text-gray-400">无</span>';

            // 影响逻辑
            document.getElementById('modalReason').textContent = n.impact_reason || '（无影响逻辑说明）';

            // 评分维度
            renderScoreCard('scoreCred', '可信度', n.credibility_score, 'text-blue-700', '#3b82f6');
            renderScoreCard('scoreImp', '影响分', (n.market_impact_score ?? 0) / 10, 'text-amber-700', '#f59e0b');
            renderScoreCard('scoreTime', '时间因子', n.time_factor, 'text-purple-700', '#8b5cf6');

            // 综合分
            document.getElementById('modalTotal').textContent = (n.total_score ?? 0).toFixed(4);

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function renderScoreCard(id, label, val, textCls, barColor) {
            const v = val ?? 0;
            const pct = (v * 100).toFixed(0);
            const el = document.getElementById(id);
            el.innerHTML = `
                <div class="flex items-center justify-between mb-1.5">
                    <span class="text-xs text-gray-500">${label}</span>
                    <span class="text-sm font-bold ${textCls}">${v.toFixed(2)}</span>
                </div>
                <div class="mini-bar"><span style="width:${pct}%;background:${barColor}"></span></div>
                <div class="text-[10px] text-gray-400 mt-1 text-right">${pct}%</div>
            `;
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ===== 主流程 =====
        async function runPipeline() {
            if (isRunning) return;
            isRunning = true;

            const btn = document.getElementById('runBtn');
            const btnText = document.getElementById('runBtnText');
            btn.disabled = true;
            btnText.textContent = '执行中…';

            // 隐藏旧结果
            document.getElementById('resultSection').classList.add('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('statsBox').classList.add('hidden');

            // 重置步骤
            resetSteps();
            setStepStatus(0, 'running');

            try {
                const data = await api('/api/generate_report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        thread_id: 'default'
                    })
                });

                const messages = data.messages || [];
                const ranked = data.ranked_news || [];

                // 步骤1：fetch_news 完成
                const fetchMsg = messages.find(m => m.includes('[fetch_news]')) || `获取原始资讯 ${data.raw_news_count ?? 0} 条`;
                setStepStatus(0, 'done', fetchMsg);
                await sleep(200);

                // 步骤2：prefilter 执行中 -> 完成
                setStepStatus(1, 'running');
                await sleep(300);
                const prefilterMsg = messages.find(m => m.includes('[prefilter]')) || 'Python预筛完成';
                setStepStatus(1, 'done', prefilterMsg);
                await sleep(200);

                // 步骤3：llm_filter 执行中 -> 完成（可能跳过）
                setStepStatus(2, 'running');
                await sleep(300);
                const llmMsg = messages.find(m => m.includes('[llm_filter]'));
                if (llmMsg) {
                    setStepStatus(2, 'done', llmMsg);
                } else {
                    setStepStatus(2, 'done', '智能路由：无重磅/科技信号，已自动跳过 LLM 过滤分析');
                }
                await sleep(200);

                // 步骤4：rank_news 执行中 -> 完成
                setStepStatus(3, 'running');
                await sleep(300);
                const rankMsg = messages.find(m => m.includes('[rank_news]')) || `排名完成，共 ${data.ranked_news_count ?? ranked.length} 条`;
                setStepStatus(3, 'done', rankMsg);

                // 统计
                document.getElementById('statsBox').classList.remove('hidden');
                document.getElementById('statRaw').textContent = data.raw_news_count ?? 0;
                document.getElementById('statFiltered').textContent = data.filtered_news_count ?? 0;
                document.getElementById('statRanked').textContent = data.ranked_news_count ?? ranked.length;

                // 表格
                renderTable(ranked);

            } catch (e) {
                setStepStatus(0, 'error', e.message);
                document.getElementById('emptyState').classList.remove('hidden');
                document.getElementById('emptyState').querySelector('p').textContent = '执行失败：' + e.message;
            } finally {
                isRunning = false;
                btn.disabled = false;
                btnText.textContent = '获取当日资讯并排名';
                // 有结果时启用预览按钮
                const previewBtn = document.getElementById('previewBtn');
                if (currentRanked && currentRanked.length > 0) {
                    previewBtn.disabled = false;
                }
            }
        }

        // ===== 推送格式预览 =====
        function generatePushPreview(rankedNews, topN = 20) {
            const dirIcon = { bullish: '▲', bearish: '▼', neutral: '—' };
            const bandIcon = {
                bullish: '强多', mildly_bullish: '偏多', neutral: '中性',
                mixed: '多空交织', mildly_bearish: '偏空', bearish: '强空',
            };
            const now = new Date();
            const dateStr = `${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const hour = now.getHours();
            const title = hour < 12 ? `A股盘前资讯 ${dateStr} 09:00` : `A股盘后资讯 ${dateStr} 15:30`;

            let lines = [`## ${title}\n`];
            rankedNews.slice(0, topN).forEach((n, i) => {
                const nTitle = (n.title || '').slice(0, 60);
                const band = bandIcon[n.impact_band] || n.impact_band || '中性';
                const direction = n.impact_direction || 'neutral';
                const score = n.market_impact_score ?? 0;
                const sectors = Array.isArray(n.affected_sectors) ? n.affected_sectors : [];
                const sectorStr = sectors.slice(0, 2).join('、') || '—';
                const stocks = Array.isArray(n.affected_stocks) ? n.affected_stocks : [];
                const stockStr = stocks.slice(0, 3).join('、');
                const reason = (n.impact_reason || '').trim().slice(0, 80);
                const icon = dirIcon[direction] || '—';

                lines.push(`**${i + 1}. ${icon}[${band}] ${nTitle}**\n`);
                let meta = `> 板块: ${sectorStr} | 影响分: ${score.toFixed(1)}`;
                if (stockStr) meta += ` | 个股: ${stockStr}`;
                lines.push(`${meta}\n`);
                if (reason) lines.push(`> ${reason}\n`);
            });
            return lines.join('\n');
        }

        function showPushPreview() {
            if (!currentRanked || currentRanked.length === 0) return;
            const content = generatePushPreview(currentRanked);
            document.getElementById('pushPreviewContent').textContent = content;
            const modal = document.getElementById('pushPreviewModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closePushPreview() {
            const modal = document.getElementById('pushPreviewModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        document.getElementById('previewBtn').addEventListener('click', showPushPreview);
        document.getElementById('pushPreviewClose').addEventListener('click', closePushPreview);
        document.getElementById('pushPreviewModal').addEventListener('click', (e) => {
            if (e.target.id === 'pushPreviewModal') closePushPreview();
        });

        // ===== 初始化 =====
        document.getElementById('runBtn').addEventListener('click', runPipeline);
        renderSteps();
        checkHealth();
        setInterval(checkHealth, 30000);
    </script>
</body>
